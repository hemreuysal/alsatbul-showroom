<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ters cümle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:#fff;padding:24px}
/* Sabit sahne; değişen yalnızca kelimelerin yeri ve "Sen" kutusunun dolgusu. */
.stage{position:relative;max-width:1150px;margin:0 auto;border-radius:14px;padding:clamp(24px,3.2vw,40px) clamp(20px,3.6vw,48px) clamp(22px,2.8vw,32px);background:#fff;color:#18181b;box-shadow:inset 0 0 0 1px #e7e5e4;transition:background-color 1.2s ease .35s,box-shadow 1.2s ease .35s}
.stage.on{background:#fde9b8;box-shadow:inset 0 0 0 1px #f6cf7a}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1;color:#71717a;transition:color 1.2s ease .35s}
.stage.on .lbl{color:#92400e}
.line{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;column-gap:.24em;row-gap:.12em;font-size:clamp(32px,4.8vw,64px);line-height:1.06;font-weight:800;letter-spacing:-.04em}
.w{position:relative;display:inline-block}
/* "Sen": yumuşak köşeli dikdörtgen; yer değiştirirken öbür kelimenin önünden geçer. */
.you{z-index:1;padding:.04em .2em .08em;border-radius:.16em;background:transparent;box-shadow:inset 0 0 0 .05em currentColor;transition:background-color .6s ease .8s,color .6s ease .8s,box-shadow .6s ease .8s}
.stage.on .you{background:#18181b;color:#fbbf24;box-shadow:inset 0 0 0 .05em #18181b}
.sub{margin-top:12px;max-width:34em;font-size:clamp(14px,1.2vw,16px);line-height:1.5;color:#71717a}
.btn{position:absolute;right:clamp(18px,2.6vw,32px);bottom:clamp(16px,2.4vw,26px);display:inline-flex;align-items:center;gap:6px;padding:6px 4px;border:0;font:600 13px "Plus Jakarta Sans",sans-serif;color:#71717a;background:transparent;cursor:pointer}
.btn:hover{color:#18181b;text-decoration:underline;text-underline-offset:3px}
@media (max-width:767px){.btn{position:static;margin-top:16px}}
@media (prefers-reduced-motion:reduce){.stage,.lbl,.you{transition:none}}
</style>
</head>
<body>
<div class="stage" id="s">
  <p class="lbl"><span id="lbl">İlan sitelerinde</span></p>
  <p class="line" id="line"></p>
  <p class="sub" id="sub">Sayfa sayfa ilan, aynı ürün, tek tek mesaj.</p>
  <button class="btn" id="btn" type="button">↻ bir daha çevir</button>
</div>
<script>
// "Sen satıcı ararsın." yerinde ters döner: "Satıcılar seni arar." olur; kelimeler yer değiştirir.
const W = { sen: ["Sen", "seni"], satici: ["satıcı", "Satıcılar"], fiil: ["ararsın.", "arar."] };
const ORDER = [["sen", "satici", "fiil"], ["satici", "sen", "fiil"]];
const TXT = [["İlan sitelerinde", "Sayfa sayfa ilan, aynı ürün, tek tek mesaj."], ["alsatbul'da", "Ne istediğini bir kez yaz, teklifler sana gelsin."]];
const s = document.getElementById("s"), line = document.getElementById("line");
const els = {};
for (const k of ORDER[0]) {
  const e = document.createElement("span");
  e.className = "w" + (k === "sen" ? " you" : "");
  e.textContent = W[k][0];
  els[k] = e;
  line.append(e);
}
let i = 0;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function flip() {
  const before = {};
  for (const k in els) before[k] = els[k].getBoundingClientRect();
  i = 1 - i;
  for (const k of ORDER[i]) { els[k].textContent = W[k][i]; line.append(els[k]); }
  s.classList.toggle("on", i === 1);
  document.getElementById("lbl").textContent = TXT[i][0];
  document.getElementById("sub").textContent = TXT[i][1];
  if (still) return;
  // Tek hareket: iki kelime düz bir çizgide yer değiştirir ("Sen" önden geçer).
  for (const k of ["sen", "satici"]) {
    const a = els[k].getBoundingClientRect(), b = before[k];
    els[k].animate([{ transform: `translate(${b.left - a.left}px,${b.top - a.top}px)` }, { transform: "none" }], { duration: 1150, easing: "cubic-bezier(.34,1.18,.45,1)" });
  }
}
document.getElementById("btn").onclick = flip;
// Görünür olunca bir kez kendiliğinden döner.
const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setTimeout(flip, 600); io.disconnect(); } }, { threshold: 0.4 });
io.observe(s);
// Vitrin çerçevesine yükseklik bildirilir.
function boy() { parent.postMessage({ vitrin: window.name, h: Math.ceil(document.documentElement.getBoundingClientRect().height) }, "*"); }
new ResizeObserver(boy).observe(document.body); addEventListener("load", boy); setTimeout(boy, 800);
</script>
</body>
</html>
