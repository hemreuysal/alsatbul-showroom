<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ters cümle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:#fff;padding:24px}
/* Cümle dönerken sahne de negatifine döner: açık taş zemin → grafit (markanın iki rengi). */
.stage{position:relative;overflow:hidden;max-width:1150px;margin:0 auto;border-radius:22px;padding:clamp(28px,4vw,52px) clamp(22px,4.5vw,64px) clamp(26px,3.5vw,44px);background:#f5f5f4;color:#52525b;transition:background-color 1.1s ease .2s,color 1.1s ease .2s}
.stage.on{background:#18181b;color:#fafaf9}
.lbl{font-family:"Caveat",cursive;font-size:clamp(22px,2vw,27px);font-weight:600;line-height:1;color:#a1a1aa}
.stage.on .lbl{color:#f59e0b}
.lbl span,.sub{display:inline-block;animation:fade .7s ease both}
.line{margin-top:12px;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.24em;isolation:isolate;font-size:clamp(36px,6.2vw,86px);line-height:1.05;font-weight:700;letter-spacing:-.03em}
.w{position:relative;display:inline-block;will-change:transform}
/* "seni": cümle dönünce amber olur, altına elle çekilmiş gibi çizgi uzar. */
.you::before{content:"";position:absolute;z-index:-1;left:-.08em;right:-.1em;bottom:-.05em;height:.075em;border-radius:999px;background:#f59e0b;transform:rotate(-1.2deg) scaleX(0);transform-origin:left center;transition:transform .7s cubic-bezier(.3,.7,.3,1) .9s}
.stage.on .you{color:#f59e0b;transition:color .6s ease .8s}.stage.on .you::before{transform:rotate(-1.2deg) scaleX(1)}
.sub{display:block;margin-top:14px;max-width:34em;font-size:clamp(15px,1.35vw,18px);line-height:1.5;animation-delay:.35s}
.btn{position:absolute;right:clamp(18px,2.6vw,32px);bottom:clamp(16px,2.4vw,26px);display:inline-flex;align-items:center;gap:6px;padding:6px 4px;border:0;font:600 13.5px "Plus Jakarta Sans",sans-serif;color:inherit;opacity:.75;background:transparent;cursor:pointer}
.btn:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
.btn i{font-style:normal;display:inline-block;transition:transform .9s ease}
.stage.on .btn i{transform:rotate(-180deg)}
@keyframes fade{from{opacity:0;transform:translateY(5px)}}
@media (max-width:767px){.btn{position:static;margin-top:16px}}
@media (prefers-reduced-motion:reduce){.stage,.you::before,.btn i{transition:none}.lbl span,.sub{animation:none}}
</style>
</head>
<body>
<div class="stage" id="s">
  <p class="lbl"><span id="lbl">ilan sitelerinde…</span></p>
  <p class="line" id="line"></p>
  <p class="sub" id="sub">Sayfa sayfa ilan, aynı ürün, tek tek mesaj.</p>
  <button class="btn" id="btn" type="button"><i>↻</i> bir daha çevir</button>
</div>
<script>
// "Sen satıcı ararsın." yerinde ters döner: kelimeler yer değiştirip "Satıcılar seni arar." olur (FLIP).
const W = { sen: ["Sen", "seni"], satici: ["satıcı", "Satıcılar"], fiil: ["ararsın.", "arar."] };
const ORDER = [["sen", "satici", "fiil"], ["satici", "sen", "fiil"]];
const TXT = [["ilan sitelerinde…", "Sayfa sayfa ilan, aynı ürün, tek tek mesaj."], ["alsatbul'da…", "Ne istediğini bir kez yaz, teklifler sana gelsin."]];
const s = document.getElementById("s"), line = document.getElementById("line");
const els = {};
for (const k of ORDER[0]) {
  const e = document.createElement("span");
  e.className = "w" + (k === "sen" ? " you" : "");
  e.textContent = W[k][0];
  els[k] = e;
  line.append(e);
}
let i = 0;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function flip() {
  const before = {};
  for (const k in els) before[k] = els[k].getBoundingClientRect();
  i = 1 - i;
  for (const k of ORDER[i]) { els[k].textContent = W[k][i]; line.append(els[k]); }
  s.classList.toggle("on", i === 1);
  for (const [id, t] of [["lbl", TXT[i][0]], ["sub", TXT[i][1]]]) {
    const n = document.getElementById(id);
    n.textContent = t;
    n.style.animation = "none"; void n.offsetWidth; n.style.animation = "";
  }
  if (still) return;
  for (const k in els) {
    const a = els[k].getBoundingClientRect(), b = before[k];
    const dx = b.left - a.left, dy = b.top - a.top;
    if (!dx && !dy) continue;
    const lift = k === "sen" ? -0.22 : k === "satici" ? 0.22 : 0;
    els[k].animate([
      { transform: `translate(${dx}px,${dy}px)` },
      { transform: `translate(${dx / 2}px,${dy / 2 + lift * a.height}px)`, offset: 0.5 },
      { transform: "translate(0,0)" },
    ], { duration: 1100, easing: "cubic-bezier(.45,.05,.25,1)" });
  }
}
document.getElementById("btn").onclick = flip;
// Görünür olunca bir kez kendiliğinden döner.
const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setTimeout(flip, 600); io.disconnect(); } }, { threshold: 0.4 });
io.observe(s);
// Vitrin çerçevesine yükseklik bildirilir.
function boy() { parent.postMessage({ vitrin: window.name, h: Math.ceil(document.documentElement.getBoundingClientRect().height) }, "*"); }
new ResizeObserver(boy).observe(document.body); addEventListener("load", boy); setTimeout(boy, 800);
</script>
</body>
</html>
