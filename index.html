<title>alsatbul tasarım vitrini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { --header:#18181b; --primary:#f59e0b; --primary-dark:#d97706; --link:#b45309; --text:#18181b; --muted:#71717a; --line:#e7e5e4; --page:#f5f5f4; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--page); color:var(--text); font:16px/1.55 "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  .top { background:var(--header); color:#fff; position:sticky; top:0; z-index:10; }
  .top .in { max-width:1280px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:20px; overflow-x:auto; }
  .logo { height:26px; width:auto; color:#fff; flex-shrink:0; overflow:visible; }
  .top nav { display:flex; gap:4px; }
  .top nav a { color:#d4d4d8; text-decoration:none; font-size:13.5px; padding:6px 10px; border-radius:6px; white-space:nowrap; }
  .top nav a:hover { background:#2a2a2f; color:#fff; }
  .kapak { max-width:1280px; margin:0 auto; padding:72px 16px 40px; }
  .kapak p.k { color:var(--link); font:600 30px/1 Caveat, cursive; margin:0 0 10px; }
  .kapak h1 { font-size:clamp(36px,6vw,68px); line-height:1.02; letter-spacing:-.035em; margin:0; color:var(--header); }
  .kapak h1 em { font-style:normal; color:var(--primary-dark); }
  .kapak p.l { color:var(--muted); max-width:640px; font-size:18px; margin:18px 0 0; }
  .parca { max-width:1280px; margin:0 auto; padding:56px 16px 24px; scroll-margin-top:56px; }
  .bas { display:flex; align-items:baseline; gap:16px; border-top:1px solid var(--line); padding-top:24px; margin-bottom:20px; }
  .no { font-weight:800; color:var(--primary-dark); font-size:15px; min-width:28px; }
  .bas h2 { margin:0; font-size:clamp(22px,3vw,30px); letter-spacing:-.025em; color:var(--header); }
  .bas p { margin:6px 0 0; color:var(--muted); max-width:720px; }
  .kutu { background:#fff; border-radius:18px; box-shadow:0 1px 0 var(--line), 0 18px 40px -28px rgba(24,24,27,.3); overflow:hidden; }
  iframe { display:block; width:100%; height:520px; border:0; }
  footer { max-width:1280px; margin:0 auto; padding:48px 16px 64px; color:var(--muted); font-size:13px; }
</style>
</head>

  <nav id="nav"></nav>
</div></header>

<section class="kapak">
  <p class="k">Tasarım vitrini</p>
  <h1>İlanları <em>ters</em> çevirdik.<br>Böyle anlatabiliriz.</h1>
  <p class="l">Şimdiye kadar denediğimiz tasarımlardan beğendiklerimiz. Hepsi çalışan demo: kutulara yazabilir, tıklayıp deneyebilirsiniz.</p>
</section>

<main id="parcalar"></main>

<footer>alsatbul · tasarım seçenekleri · Ekim 2026</footer>

<script>
const PARCALAR = [
  ["ters-ilan", "Ters ilan", "Önce herkesin bildiği ilan sayfası görünür, sonra kartlar dönüp arkasındaki talepler ortaya çıkar."],
  ["sohbet", "Sohbet", "Talep yazılır, teklifler mesaj olarak gelir. Nasıl çalıştığını birkaç saniyede gösterir."],
  ["miknatis", "Mıknatıs", "Yazdıkça teklifler mıknatısa çekilir."],
  ["araniyor", "SATILIK → ARANIYOR", "Dev \"SATILIK\" yazısı harf harf \"ARANIYOR\" olur. Görsel yok, yalnızca tipografi."],
  ["iki-kapi", "İki kapı", "Alıcı ve satıcı için iki ayrı giriş: \"Ne lazım? Yaz\" ve \"Elinde var mı?\""],
  ["kalabalik", "Kalabalık", "Kutuya yazdıkça senin gibi arayanlar yanar: \"3 kişi senin gibi telefon arıyor\"."],
  ["cumle", "Cümle", "\"Ben ___ arıyorum, bütçem ___ TL.\" Boşluklara yazılır, anahtar satıcı cümlesine çevirir."],
  ["nasil-calisir", "Nasıl çalışır: mıknatıs", "Logodaki mıknatıs ürünü anlatır: talep yazılır, mıknatıs satıcıları çeker, teklifler talebe uçar. Güvenceler adımların altında."],
  ["miknatis-tozu", "Mıknatıs ve demir tozu", "Kapanış sahnesi. Sahneye serpilmiş demir tozu gerçek manyetik alana göre dizilir; fareyi gezdirince imleç ikinci bir mıknatıs olur, tozlar ona döner. Talepler kutuplara yapışır, kutuplar amber parlar. Kutuya yazıp Talep ver de."],
  ["mobil", "Mobil uygulama planı", "Uygulama ekranları, sitenin bugünkü renkleriyle."],
];
const nav = document.getElementById("nav"), kok = document.getElementById("parcalar");
PARCALAR.forEach(([ad, baslik, aciklama], i) => {
  nav.insertAdjacentHTML("beforeend", `<a href="#${ad}">${baslik}</a>`);
  kok.insertAdjacentHTML("beforeend", `<section class="parca" id="${ad}">
    <div class="bas"><span class="no">${String(i + 1).padStart(2, "0")}</span><div><h2>${baslik}</h2><p>${aciklama}</p></div></div>
    <div class="kutu"><iframe name="${ad}" src="parca/${ad}.html" title="${baslik}" loading="lazy"></iframe></div>
  </section>`);
});
// Her parça kendi yüksekliğini bildirir; çerçeve içeriğe göre uzar.
addEventListener("message", (e) => {
  const d = e.data;
  if (!d || !d.vitrin || typeof d.h !== "number") return;
  const f = document.querySelector(`iframe[name="${d.vitrin}"]`);
  if (f && Math.abs(f.offsetHeight - d.h) > 2) f.style.height = Math.min(d.h, 12000) + "px";
});
</script>
